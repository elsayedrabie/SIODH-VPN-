plugins{
	   id 'com.android.application'
       id "com.google.gms.google-services"
       id 'io.michaelrocks.paranoid'
}

android {
    compileSdk 33


signingConfigs {
        release {
            storeFile file("gatesccn.jks")
            storePassword '123456'
            keyAlias 'gatesccn'
            keyPassword '123456'
        }
    }
    defaultConfig {
        applicationId "com.socksfast.vpn"
		minSdkVersion 21
        targetSdkVersion 33
        versionCode 16
        versionName "1.1.6"
        vectorDrawables.useSupportLibrary = true
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lint {
        disable 'MissingTranslation'
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
	packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    namespace 'com.socksfast.vpn'
}
dependencies {
	implementation files('libs/okhttp.jar')
    implementation files('libs/libv2ray.aar')
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation files('libs/commons-codec-1.11.jar')
    implementation files('libs/commons-logging-1.2.jar')
    implementation files('libs/httpclient-4.5.13.jar')
    implementation files('libs/httpcore-4.4.13.jar')
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:2.1.0'
    implementation 'com.github.kimchangyoun:rootbeerFresh:+'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.netfreemx:genmxutils:1.0.2'
    implementation 'com.google.crypto.tink:tink-android:1.2.1'
    implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
	implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation "androidx.work:work-runtime:2.7.0-alpha05"
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
	implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:22.2.0'
	implementation 'org.connectbot.jbcrypt:jbcrypt:1.0.0'
	implementation "com.android.volley:volley:1.2.1"
    implementation 'com.airbnb.android:lottie:6.0.0'
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.3.1"
}
